name: Build paper exports

on:
  push:
    branches:
      - paper/auditor-hardening-2026-10-17
    paths:
      - paper/fbdg.md
      - paper/references.bib
      - .github/workflows/build-paper-exports.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: paper/auditor-hardening-2026-10-17
          fetch-depth: 0

      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Rebuild generated manuscript exports
        run: make paper

      - name: Commit refreshed exports
        run: |
          if git diff --quiet -- paper/fbdg.tex paper/fbdg.pdf paper/fbdg.docx; then
            echo "Generated exports are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/fbdg.tex paper/fbdg.pdf paper/fbdg.docx
          git commit -m "Refresh generated paper exports [skip ci]"
          git push origin HEAD:paper/auditor-hardening-2026-10-17
