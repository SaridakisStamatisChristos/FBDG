name: Populate FBDG research package

# One-shot bootstrap rerun after staging integrity verification.
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore canonical source package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/pkg.* > /tmp/fbdg-package.b64
          base64 -d /tmp/fbdg-package.b64 > /tmp/fbdg-package.tar.xz
          mkdir -p /tmp/fbdg-package
          tar -xJf /tmp/fbdg-package.tar.xz -C /tmp/fbdg-package
          rsync -a /tmp/fbdg-package/ ./
          rm -rf bootstrap

      - name: Validate structured construction
        run: python3 validation/fbdg_structured_validate.py

      - name: Install paper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Build manuscript exports
        run: make paper

      - name: Commit populated research artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Populate FBDG research package [skip ci]'
            git push
          fi
